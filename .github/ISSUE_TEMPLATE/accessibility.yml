name: Accessibility barrier
description: Speech, braille, MathML or the site do not work for someone using assistive technology.
title: "a11y: "
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Accessibility barriers are bugs in mathra; see [ACCESSIBILITY.md](https://github.com/matheusmota-dev-br/mathra/blob/main/.github/ACCESSIBILITY.md) for what it promises and what is already known.

        Reports that something **works** with your screen reader are welcome too.
  - type: dropdown
    id: area
    attributes:
      label: What is affected
      multiple: true
      options:
        - Speech (what a screen reader says)
        - Braille (CMU or Nemeth)
        - MathML output
        - The SVG markup (role, title, lang, metadata)
        - The site (playground, reference page)
        - Something else
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The equation exactly as given. For the site, the page and what you were doing.
      render: latex
    validations:
      required: true
  - type: input
    id: options
    attributes:
      label: Options
      description: "For example `--locale fr`, `--braille-code cmu`."
  - type: textarea
    id: got
    attributes:
      label: What was said, shown or brailled
      description: Write it as you heard or read it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: How a person would say or write it; cite the braille code's section if you know it.
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: Assistive technology
      description: "Name and version, for example NVDA 2026.3, VoiceOver on macOS 26, a braille display model."
  - type: input
    id: platform
    attributes:
      label: Browser and system
      description: "For example Firefox 145 on Windows 11."
  - type: input
    id: version
    attributes:
      label: mathra version
      description: "`mathra --version`, or the crate, npm or PyPI version, or \"the site\"."
    validations:
      required: true
