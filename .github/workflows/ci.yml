# The checks of scripts/check.sh, run again on main after each merge. Pull requests are checked on the
# contributor's machine by the hooks in .githooks/.
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude mathra-python --all-targets -- -D warnings
      - run: cargo llvm-cov --workspace --exclude mathra-python --features mathra/latin-modern --fail-under-lines 100 --fail-under-functions 100
      - run: cargo clippy -p mathra-cli --no-default-features --all-targets -- -D warnings
      - run: cargo test -p mathra-cli --no-default-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # must match the wasm-bindgen version in Cargo.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo test -p mathra-wasm --target wasm32-unknown-unknown
      - run: site/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the npm package as users get it: packed, installed, imported with ESM and require
      - run: npm/build.sh && npm/test/run.sh
      # the editor, on the package just built: its unit tests and Chromium together must run every line
      # and function of editor/src (Node 24 runs the TypeScript tests as they are)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - working-directory: editor
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright-core install --with-deps chromium
          node --no-warnings scripts/coverage.mjs --fail-under 100
      # the VS Code extension, on the same package: every line, branch and function of vscode/src run,
      # and the .vsix it makes
      - working-directory: vscode
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm coverage
          pnpm package
      # the Chrome and Edge extension, on the same package and editor: every line, branch and function of
      # browser/src run, and the extension it builds
      - working-directory: browser
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm coverage
          pnpm build
      # the Google Docs and Slides add-on: Code.js in Node and the sidebar in Chromium (installed for the
      # editor above), every line and function run
      - working-directory: gworkspace
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm coverage

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          cd crates/python
          maturin develop
          python -m pytest tests
