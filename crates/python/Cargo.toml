[package]
name = "mathra-python"
# the Python package has its own version, published by py-v* tags (.github/workflows/pypi.yml)
version = "1.12.0"
description = "Python bindings of mathra: math LaTeX, chemistry and diagrams to accessible SVG"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# the module name imported in Python (`import mathra`) comes from pyproject.toml
name = "mathra_python"
crate-type = ["cdylib"]

[dependencies]
# PNG output (tex_to_png), and Noto Emoji as the fallback font for emoji; the wasm package leaves
# both out (the browser rasterizes, and fallback fonts are loaded on demand there)
mathra = { workspace = true, features = ["png", "emoji"] }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
