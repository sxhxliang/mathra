[package]
name = "mathra-cli"
description = "mathra command line: accessible SVG equations, chemistry and diagrams, without a TeX install."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["latex", "math", "svg", "accessibility", "cli"]
categories = ["command-line-utilities", "text-processing", "rendering"]

[[bin]]
name = "mathra"
path = "src/main.rs"

[dependencies]
mathra.workspace = true

[features]
default = ["png", "emoji"]
# PNG output (`-o file.png`, `--png`); a build without it refuses .png instead of writing an SVG there
png = ["mathra/png"]
# Noto Emoji as the fallback font for emoji (the core leaves it off); without it, emoji are boxes
emoji = ["mathra/emoji"]
