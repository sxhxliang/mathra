<!doctype html>
<!-- mathra's editor, in the toolbar's popup and in the window that opens selected LaTeX -->
<html>
<head>
<meta charset="utf-8">
<title>mathra</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; }
  /* the popup: Chrome's largest (800 × 600); the editor stacks its parts at that width, so the page
     scrolls inside it and the editor's own background covers all of it, in light and dark */
  body { width: 800px; height: 590px; overflow-y: auto; }
  body.window { width: auto; height: 100vh; }
  mathra-editor { display: block; height: auto; min-height: 100%; }
</style>
</head>
<body>
<script type="module" src="dist/page.js"></script>
</body>
</html>
