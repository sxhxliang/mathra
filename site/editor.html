<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mathra · Editor</title>
<meta name="description" content="A math editor drawn by mathra: build a formula with a cursor and empty places, palettes, a command menu and a keyboard on the screen, and copy it as LaTeX, MathML or SVG. Chemistry, structures and diagrams too. Runs in your browser.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script type="importmap">{ "imports": { "@mathlabs/mathra": "./pkg/editor/web/index.js" } }</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  mathra-editor { height: 100%; }
  .brand { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
  .brand img { width: 28px; height: 28px; border-radius: 5px; display: block; }
  .brand b { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
  .brand span { font-size: 13px; opacity: 0.6; }
  .github { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-left: 4px; color: inherit; opacity: 0.7; border-radius: 6px; transition: opacity 0.12s, background 0.12s; }
  .github:hover { opacity: 1; background: color-mix(in srgb, currentColor 10%, transparent); }
  .github:focus-visible { outline: 2px solid #1f5f99; outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { .github { transition: none; } }
  @media (max-width: 640px) { .brand span { display: none; } }
</style>
</head>
<body>
<mathra-editor id="editor" layout="page" locale="en" value="x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}">
  <a slot="title" class="brand" id="home" href="index.html" title="mathra's site"><img src="favicon.svg" alt="" width="28" height="28"><b>mathra</b><span>editor</span></a>
  <a slot="actions" class="github" id="docs" href="editor-docs.html" title="How it works" aria-label="How it works">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 8h8M8 12h6"/></svg>
  </a>
  <a slot="actions" class="github" id="github" href="https://github.com/matheusmota-dev-br/mathra/tree/main/editor" target="_blank" rel="noopener" title="Code on GitHub" aria-label="Code on GitHub">
    <!-- the GitHub mark (Octicons, MIT) -->
    <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</mathra-editor>
<script type="module">
  import "./pkg/editor/dist/index.js";
  const editor = document.getElementById("editor");
  const read = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  // the language chosen before, else the browser's, else English
  const lang = (navigator.language || "").toLowerCase();
  const guess = lang.startsWith("pt") ? "pt-BR" : lang.startsWith("es") ? "es" : "en";
  // the theme is the one the rest of the site uses (the same key)
  editor.setAttribute("locale", read("mathra-locale") || guess);
  if (read("mathra-theme")) editor.setAttribute("theme", read("mathra-theme"));
  const WORDS = {
    "pt-BR": ["Código no GitHub", "Site do mathra", "Como funciona"],
    es: ["Código en GitHub", "Sitio de mathra", "Cómo funciona"],
    en: ["Code on GitHub", "mathra's site", "How it works"],
  };
  const name = (locale) => {
    const [code, site, docs] = WORDS[locale] ?? WORDS.en;
    const help = document.getElementById("docs");
    help.title = docs;
    help.setAttribute("aria-label", docs);
    const github = document.getElementById("github");
    github.title = code;
    github.setAttribute("aria-label", code);
    document.getElementById("home").title = site;
    document.documentElement.lang = locale;
  };
  name(editor.getAttribute("locale"));
  editor.addEventListener("mathra-locale", (e) => { write("mathra-locale", e.detail.locale); name(e.detail.locale); });
  editor.addEventListener("mathra-theme", (e) => write("mathra-theme", e.detail.theme));
  // a formula in the address (#latex=…), as the Google Docs and Slides add-on links its equations:
  // opened in the editor; the part after # stays in the browser
  const latex = new URLSearchParams(location.hash.slice(1)).get("latex");
  if (latex) editor.setAttribute("value", latex);
  editor.focus();
</script>
</body>
</html>
