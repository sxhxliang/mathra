lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@mathlabs/mathra':
        specifier: file:../npm/pkg
        version: file:../npm/pkg
      '@mathlabs/mathra-editor':
        specifier: file:../editor
        version: file:../editor(@mathlabs/mathra@file:../npm/pkg)
      playwright-core:
        specifier: 1.64.1
        version: 1.64.1

packages:

  '@mathlabs/mathra-editor@file:../editor':
    resolution: {directory: ../editor, type: directory}
    peerDependencies:
      '@mathlabs/mathra': '>=1.12.0'

  '@mathlabs/mathra@file:../npm/pkg':
    resolution: {directory: ../npm/pkg, type: directory}
    engines: {node: '>=18'}

  playwright-core@1.64.1:
    resolution: {integrity: sha512-BC4s8y6SEVA6Q1rSxZTto8hI1KUI3xXlHGZgvGqP4IqPdI/a6FX9H29IDNz7vKo9l21b6LfYosScPL6M3xxyDQ==}
    engines: {node: '>=20'}
    hasBin: true

snapshots:

  '@mathlabs/mathra-editor@file:../editor(@mathlabs/mathra@file:../npm/pkg)':
    dependencies:
      '@mathlabs/mathra': file:../npm/pkg

  '@mathlabs/mathra@file:../npm/pkg': {}

  playwright-core@1.64.1: {}
