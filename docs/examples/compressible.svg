<svg xmlns="http://www.w3.org/2000/svg" xmlns:mathra="urn:mathra:1" viewBox="-320 -1714 31729.191 2729" width="951.876" height="81.87" style="vertical-align: -0.695em" role="img" aria-labelledby="mathra-a8ba04ca-speech" lang="en" data-mathra-version="1.9.1"><rect x="-320" y="-1714" width="31729.191" height="2729" rx="160" fill="#ffffff"/><title id="mathra-a8ba04ca-speech">fraction, partial open paren rho u close paren, over partial t, end fraction plus nabla times open paren rho u ⊗ u close paren equals negative nabla p plus nabla times open bracket mu open paren nabla u plus open paren nabla u close paren to the T close paren minus 2 over 3 mu open paren nabla times u close paren I close bracket plus rho g</title><metadata><mathra:source type="latex">\frac{\partial (\rho \mathbf{u})}{\partial t} + \nabla \cdot \left( \rho\, \mathbf{u} \otimes \mathbf{u} \right) = -\nabla p + \nabla \cdot \left[ \mu \left( \nabla \mathbf{u} + \left( \nabla \mathbf{u} \right)^{\mathsf{T}} \right) - \frac{2}{3} \mu \left( \nabla \cdot \mathbf{u} \right) \mathbf{I} \right] + \rho \mathbf{g}</mathra:source><mathra:tree>{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;fraction&quot;,&quot;num&quot;:{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;∂&quot;,&quot;class&quot;:&quot;ord&quot;},{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;(&quot;,&quot;class&quot;:&quot;open&quot;},{&quot;type&quot;:&quot;identifier&quot;,&quot;name&quot;:&quot;ρ&quot;},{&quot;type&quot;:&quot;identifier&quot;,&quot;name&quot;:&quot;u&quot;,&quot;variant&quot;:&quot;bold&quot;},{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;)&quot;,&quot;class&quot;:&quot;close&quot;}]},&quot;den&quot;:{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;∂&quot;,&quot;class&quot;:&quot;ord&quot;},{&quot;type&quot;:&quot;ident