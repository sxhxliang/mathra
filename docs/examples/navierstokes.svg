<svg xmlns="http://www.w3.org/2000/svg" xmlns:mathra="urn:mathra:1" viewBox="-325 -1671 23618.467 2805" width="708.554" height="84.15" style="vertical-align: -0.814em" role="img" aria-labelledby="mathra-50a84c31-speech" lang="en" data-mathra-version="1.6.1"><rect x="-325" y="-1671" width="23618.467" height="2805" rx="160" fill="#ffffff"/><title id="mathra-50a84c31-speech">rho open paren fraction, partial u, over partial t, end fraction plus open paren u times nabla close paren u close paren equals negative nabla p plus mu nabla squared u plus rho g comma nabla times u equals 0</title><metadata><mathra:source type="latex">\rho \left( \frac{\partial \mathbf{u}}{\partial t} + (\mathbf{u} \cdot \nabla) \mathbf{u} \right) = -\nabla p + \mu \nabla^2 \mathbf{u} + \rho \mathbf{g}, \qquad \nabla \cdot \mathbf{u} = 0</mathra:source><mathra:tree>{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;identifier&quot;,&quot;name&quot;:&quot;ρ&quot;},{&quot;type&quot;:&quot;delimited&quot;,&quot;open&quot;:&quot;(&quot;,&quot;close&quot;:&quot;)&quot;,&quot;parts&quot;:[{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;fraction&quot;,&quot;num&quot;:{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;∂&quot;,&quot;class&quot;:&quot;ord&quot;},{&quot;type&quot;:&quot;identifier&quot;,&quot;name&quot;:&quot;u&quot;,&quot;variant&quot;:&quot;bold&quot;}]},&quot;den&quot;:{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;∂&quot;,&quot;class&quot;:&quot;ord&quot;},{&quot;type&quot;:&quot;identifier&quot;,&quot;name&quot;:&quot;t&quot;}]}},{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;+&quot;,&quot;class&quot;:&quot;bin&quot;},{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;(&quot;,&quot;class&quot;:&quot;open&quot;},{&quot;type&quot;:&quot;identifier&quot;,&quot