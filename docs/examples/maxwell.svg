<svg xmlns="http://www.w3.org/2000/svg" xmlns:mathra="urn:mathra:1" viewBox="-320 -2883.05 18389.777 5250.1" width="551.693" height="157.503" style="vertical-align: -2.047em" role="img" aria-labelledby="mathra-13038dde-speech" lang="en" data-mathra-version="1.9.2"><rect x="-320" y="-2883.05" width="18389.777" height="5250.1" rx="160" fill="#ffffff"/><title id="mathra-13038dde-speech">nabla times vector E equals rho over epsilon sub 0 nabla times vector B equals 0; nabla times vector E equals negative fraction, partial vector B, over partial t, end fraction nabla times vector B equals mu sub 0 vector J plus mu sub 0 epsilon sub 0 fraction, partial vector E, over partial t, end fraction</title><metadata><mathra:source type="latex">\begin{aligned} \nabla \cdot \vec{E} &amp;= \frac{\rho}{\varepsilon_0} &amp; \nabla \cdot \vec{B} &amp;= 0 \\ \nabla \times \vec{E} &amp;= -\frac{\partial \vec{B}}{\partial t} &amp; \nabla \times \vec{B} &amp;= \mu_0 \vec{J} + \mu_0 \varepsilon_0 \frac{\partial \vec{E}}{\partial t} \end{aligned}</mathra:source><mathra:tree>{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;table&quot;,&quot;shape&quot;:&quot;aligned&quot;,&quot;rows&quot;:[[{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;∇&quot;,&quot;class&quot;:&quot;ord&quot;},{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;·&quot;,&quot;class&quot;:&quot;bin&quot;},{&quot;type&quot;:&quot;accent&quot;,&quot;base&quot;:{&quot;type&quot;:&quot;identifier&quot;,&quot;name&quot;:&quot;E&quot;},&quot;accent&quot;:&quot;⃗&quot;,&quot;stretchy&quot;:false}]},{&quot;type&quot;:&quot;row&quot;,&quot;children&quot;:[{&quot;type&quot;:&quot;operator&quot;,&quot;symbol&quot;:&quot;=&quot;,&quot;class&quot;:&quot;rel&quot;},{&quot;type&quot;:&quot;fraction&quot;,&quot;num&quot;:{&quot;type&quot;:&quot;identifier&quot;,&quot;name&quot;:&quot;ρ&quot;},&quot;den&quot;:{&quot;type&quot;:&q