[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/python", "crates/wasm"]
# python and wasm need maturin and wasm-bindgen to build a package; they stay out of the default `cargo build`
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "1.9.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusmota-dev-br/mathra"
homepage = "https://github.com/matheusmota-dev-br/mathra"

[workspace.dependencies]
# the published name of the core lives only here and in crates/core/Cargo.toml
mathra = { path = "crates/core", version = "1.9.2" }

# The wasm that npm/, site/ and bench/ ship (`--profile wasm`): built for size, since every browser
# downloads it: about 12% smaller than release with gzip and about 13% slower per equation (bench/),
# with the same SVGs. Native builds (CLI, Python, Rust) keep the release profile.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
